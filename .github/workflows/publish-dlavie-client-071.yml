name: Publish DLavie Client 0.7.1-alpha

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-dlavie-client-071.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Android artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-b19c-81f7-ae7c-a6362bf61c0a/raw?se=2026-08-05T14:38:53Z&sp=r&sv=2026-02-06&sr=b&scid=227c73a9-87cb-5e11-ad7f-e79f217a8621&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T12:38:54Z&ske=2026-08-06T12:38:54Z&sks=b&skv=2026-02-06&sig=lgJAUwJ%2BBJWJ759l%2BTYyDoEbnRLzV%2BIHWQKlnz8PMFo%3D' \
            --output artifact.zip
          unzip -o artifact.zip -d artifact
          test "$(sha256sum artifact/app-release.apk | awk '{print $1}')" = "f19807f6ad7bd7ed5f51e8fe706e538380ffd76aa3d402d729834f2dc0616874"
          mv artifact/app-release.apk DLavie-Client-0.7.1-alpha.apk

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.7.1-alpha >/dev/null 2>&1; then
            gh release upload v0.7.1-alpha DLavie-Client-0.7.1-alpha.apk --clobber
          else
            gh release create v0.7.1-alpha DLavie-Client-0.7.1-alpha.apk \
              --title "DLavie Client 0.7.1-alpha" \
              --notes "UI readability hotfix: force consistent dark mode before activity creation, explicit EditText and hint colors, a dedicated dark dialog surface, and MaterialAlertDialogBuilder for all launcher dialogs. Fixes invisible dialog options and typed text on devices using light system mode or OEM theme overrides."
          fi

      - name: Update public updater manifest
        run: |
          mkdir -p dlavie-client
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          published = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          manifest = {
              'latestVersionCode': 12,
              'latestVersionName': '0.7.1-alpha',
              'minimumSupportedVersionCode': 2,
              'mandatory': False,
              'apkUrl': 'https://github.com/drmacze/DLavie-Launcher-Data/releases/download/v0.7.1-alpha/DLavie-Client-0.7.1-alpha.apk',
              'sha256': 'f19807f6ad7bd7ed5f51e8fe706e538380ffd76aa3d402d729834f2dc0616874',
              'notes': 'Perbaikan teks hilang: aplikasi dikunci ke tema gelap, warna teks dan hint input dibuat eksplisit, serta seluruh dialog memakai permukaan gelap Material. Opsi pilihan game dan teks ketikan sekarang terlihat pada mode sistem terang maupun skin OEM.',
              'publishedAt': published,
          }
          status = {
              'status': 'published',
              'version': '0.7.1-alpha',
              'versionCode': 12,
              'sha256': manifest['sha256'],
              'releaseUrl': 'https://github.com/drmacze/DLavie-Launcher-Data/releases/tag/v0.7.1-alpha',
              'publishedAt': published,
          }
          open('dlavie-client/update.json', 'w').write(json.dumps(manifest, indent=2) + '\n')
          open('dlavie-client/publish-status.json', 'w').write(json.dumps(status, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dlavie-client/update.json dlavie-client/publish-status.json
          git commit -m "release: publish DLavie Client 0.7.1-alpha"
          git push
