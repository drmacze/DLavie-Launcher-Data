name: Publish DLavie Client 0.2.1-alpha

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-dlavie-client-021.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Download and verify signed artifact
        env:
          ARTIFACT_URL: "https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-b91c-81fb-9940-009ea4b681c0/raw?se=2026-08-01T04:06:51Z&sp=r&sv=2026-02-06&sr=b&scid=78b2167c-3ddc-5313-b946-6007a6bdce27&skoid=27fbae2c-124f-4566-a0d8-1b07a5a41c53&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T01:16:57Z&ske=2026-08-02T01:16:57Z&sks=b&skv=2026-02-06&sig=oxD/qcWUvHXDM8OqE4udIgmxKm8R0Np0f52NUVjKWAY%3D"
        run: |
          curl --fail --location "$ARTIFACT_URL" --output artifact.zip
          unzip -o artifact.zip
          mv app-release.apk DLavie-Client-0.2.1-alpha.apk
          echo "9c660dd3992eade2377cfc1539831c97a16771de632374ae3062e634a8b5139a  DLavie-Client-0.2.1-alpha.apk" | sha256sum --check -

      - name: Create public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.2.1-alpha
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" DLavie-Client-0.2.1-alpha.apk DLavie-Client-release.sha256 --clobber
          else
            gh release create "$TAG" \
              DLavie-Client-0.2.1-alpha.apk \
              DLavie-Client-release.sha256 \
              --title "DLavie Client 0.2.1-alpha" \
              --notes "Adds automatic real-time streaming text while checking the update manifest, comparing versions, and reporting update status."
          fi

      - name: Publish updater manifest and status marker
        run: |
          mkdir -p dlavie-client
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > dlavie-client/update.json <<EOF
          {
            "latestVersionCode": 3,
            "latestVersionName": "0.2.1-alpha",
            "minimumSupportedVersionCode": 2,
            "mandatory": false,
            "apkUrl": "https://github.com/drmacze/DLavie-Launcher-Data/releases/download/v0.2.1-alpha/DLavie-Client-0.2.1-alpha.apk",
            "sha256": "9c660dd3992eade2377cfc1539831c97a16771de632374ae3062e634a8b5139a",
            "notes": "Pengecekan update otomatis kini menampilkan streaming text nyata: koneksi metadata, HTTP response, validasi manifest, dan perbandingan version code.",
            "publishedAt": "$PUBLISHED_AT"
          }
          EOF
          cat > dlavie-client/publish-status.json <<EOF
          {
            "status": "published",
            "version": "0.2.1-alpha",
            "versionCode": 3,
            "sha256": "9c660dd3992eade2377cfc1539831c97a16771de632374ae3062e634a8b5139a",
            "releaseUrl": "https://github.com/drmacze/DLavie-Launcher-Data/releases/tag/v0.2.1-alpha",
            "publishedAt": "$PUBLISHED_AT"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dlavie-client/update.json dlavie-client/publish-status.json
          git commit -m "release: publish DLavie Client 0.2.1-alpha manifest"
          git push
