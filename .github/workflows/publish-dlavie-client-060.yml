name: Publish DLavie Client 0.6.0-alpha

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-dlavie-client-060.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified GitHub Actions artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-de68-81fa-ae2a-23291fd1e071/raw?se=2026-08-01T21:55:06Z&sp=r&sv=2026-02-06&sr=b&scid=eb486eab-fd24-5971-a324-f9728037d633&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T01:18:39Z&ske=2026-08-02T01:18:39Z&sks=b&skv=2026-02-06&sig=KA0C3iz61gAvcTFuPP9ROAuMeIEhQAueEu2AXrs3Rrg%3D' \
            --output artifact.zip
          unzip -o artifact.zip -d artifact
          test "$(sha256sum artifact/app-release.apk | awk '{print $1}')" = "1297cc3a574821ad39a0739684ed76aa34476f832066c6c874137014951ec21d"
          mv artifact/app-release.apk DLavie-Client-0.6.0-alpha.apk

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.6.0-alpha >/dev/null 2>&1; then
            gh release upload v0.6.0-alpha DLavie-Client-0.6.0-alpha.apk --clobber
          else
            gh release create v0.6.0-alpha DLavie-Client-0.6.0-alpha.apk \
              --title "DLavie Client 0.6.0-alpha" \
              --notes "World transport foundation: authoritative snapshots, entity spawn/transform/remove, interest management, movement rejection/correction, and safe Android GameBridge contract. Native GTA adapter is not included yet."
          fi

      - name: Update public manifest and status
        run: |
          mkdir -p dlavie-client
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          published = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          manifest = {
              'latestVersionCode': 9,
              'latestVersionName': '0.6.0-alpha',
              'minimumSupportedVersionCode': 2,
              'mandatory': False,
              'apkUrl': 'https://github.com/drmacze/DLavie-Launcher-Data/releases/download/v0.6.0-alpha/DLavie-Client-0.6.0-alpha.apk',
              'sha256': '1297cc3a574821ad39a0739684ed76aa34476f832066c6c874137014951ec21d',
              'notes': 'Fondasi transport multiplayer: snapshot world authoritative, spawn/transform/remove entity, interest management, anti-teleport, koreksi posisi server, serta kontrak GameBridge Android yang aman.',
              'publishedAt': published,
          }
          status = {
              'status': 'published',
              'version': '0.6.0-alpha',
              'versionCode': 9,
              'sha256': manifest['sha256'],
              'releaseUrl': 'https://github.com/drmacze/DLavie-Launcher-Data/releases/tag/v0.6.0-alpha',
              'publishedAt': published,
          }
          open('dlavie-client/update.json', 'w').write(json.dumps(manifest, indent=2) + '\n')
          open('dlavie-client/publish-status.json', 'w').write(json.dumps(status, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dlavie-client/update.json dlavie-client/publish-status.json
          git commit -m "release: publish DLavie Client 0.6.0-alpha"
          git push
