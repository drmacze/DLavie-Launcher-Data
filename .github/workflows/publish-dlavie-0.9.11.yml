name: Publish DLavie Client 0.9.11-alpha

on:
  push:
    paths:
      - .github/workflows/publish-dlavie-0.9.11.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-dlavie-client-0.9.11-alpha
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: v0.9.11-alpha
      ASSET_NAME: DLavie-Client-0.9.11-alpha.apk
      EXPECTED_APK_SHA256: 3e8b64e2c121602cd67ed856ad001935a4e5c69f3e0bc88eaa19126c4b953c6a
      EXPECTED_CERT_SHA256: 3f773167f7ab55ae1c6cfaa92b2bc85d46f2eade94611322b11b780fbfeb598b
      ARTIFACT_URL: 'https://sdmntprseasia.oaiusercontent.com/files/00000000-82f0-8207-a983-cb359b821c1d/raw?se=2026-08-07T11%3A48%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=4d7eaa9f-39fe-5604-9cf7-09ebe0712089&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T06%3A16%3A49Z&ske=2026-08-08T06%3A16%3A49Z&sks=b&skv=2026-02-06&sig=HuHTzXWuzwRq5PwQzVpQkiPcWEBnYnQ7Ax1/Owyoeb4%3D'

    steps:
      - name: Checkout launcher data
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install APK verification tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'build-tools;35.0.0'

      - name: Download validated CI artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 "$ARTIFACT_URL" -o /tmp/dlavie-ci.zip
          mkdir -p /tmp/dlavie-ci
          unzip -q /tmp/dlavie-ci.zip -d /tmp/dlavie-ci
          APK=$(find /tmp/dlavie-ci -type f -path '*/app/build/outputs/apk/release/app-release.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "/tmp/$ASSET_NAME"
          echo "$EXPECTED_APK_SHA256  /tmp/$ASSET_NAME" | sha256sum -c -

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="/tmp/$ASSET_NAME"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.log
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.log
          grep -Fiq "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA256" /tmp/apksigner.log
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/badging.log
          grep -Fq "package: name='id.dlavie.client' versionCode='26' versionName='0.9.11-alpha'" /tmp/badging.log
          unzip -l "$APK" | tee /tmp/apk-contents.log
          grep -q 'META-INF/services/com.android.apksig.kms.KmsSignerEngineProvider' /tmp/apk-contents.log

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="/tmp/$ASSET_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title 'DLavie Client 0.9.11-alpha' \
              --notes 'Fix AndroidKeyStore SHA1withRSA compatibility for the required legacy v1/JAR APK signature. Uses a fresh local key alias with SHA-1/SHA-256/SHA-512 authorization and preflight signing.'
          fi

      - name: Verify public release asset
        shell: bash
        run: |
          set -euo pipefail
          APK_URL="https://github.com/drmacze/DLavie-Launcher-Data/releases/download/$TAG/$ASSET_NAME"
          for attempt in 1 2 3 4 5; do
            if curl --fail --location "$APK_URL" -o /tmp/published.apk; then
              break
            fi
            sleep 3
          done
          test -s /tmp/published.apk
          echo "$EXPECTED_APK_SHA256  /tmp/published.apk" | sha256sum -c -

      - name: Publish launcher update manifest
        shell: bash
        run: |
          set -euo pipefail
          APK_URL="https://github.com/drmacze/DLavie-Launcher-Data/releases/download/$TAG/$ASSET_NAME"
          PUBLISHED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq \
            --argjson versionCode 26 \
            --arg versionName '0.9.11-alpha' \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$EXPECTED_APK_SHA256" \
            --arg notes 'Memperbaiki kegagalan SHA1withRSA pada AndroidKeyStore. Loader membuat key lokal baru dengan izin SHA-1/SHA-256/SHA-512 dan melakukan preflight SHA1withRSA + SHA256withRSA sebelum menandatangani APK.' \
            --arg publishedAt "$PUBLISHED_AT" \
            '.latestVersionCode = $versionCode |
             .latestVersionName = $versionName |
             .mandatory = false |
             .apkUrl = $apkUrl |
             .sha256 = $sha256 |
             .notes = $notes |
             .publishedAt = $publishedAt' \
            dlavie-client/update.json > /tmp/update.json
          mv /tmp/update.json dlavie-client/update.json
          jq -e '.latestVersionCode == 26 and .latestVersionName == "0.9.11-alpha" and .mandatory == false' dlavie-client/update.json

      - name: Commit manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dlavie-client/update.json
          if git diff --cached --quiet; then
            echo 'Manifest already published.'
          else
            git commit -m 'release: publish DLavie Client 0.9.11-alpha'
            git push
          fi
