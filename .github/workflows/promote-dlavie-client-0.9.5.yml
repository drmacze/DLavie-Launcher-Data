name: Promote DLavie Client 0.9.5

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/promote-dlavie-client-0.9.5.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout launcher data
        uses: actions/checkout@v4

      - name: Fetch validated release metadata
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/drmacze/dlavie-engine/main/releases/dlavie-client-0.9.5.json"
          if ! curl --fail --silent --show-error --location "$URL" --output /tmp/update.json; then
            echo "Release metadata 0.9.5 belum tersedia; tidak ada perubahan."
            exit 0
          fi

          test "$(jq -r '.latestVersionCode' /tmp/update.json)" = "20"
          test "$(jq -r '.latestVersionName' /tmp/update.json)" = "0.9.5-alpha"
          jq -e '.apkUrl | startswith("https://github.com/drmacze/dlavie-engine/releases/download/v0.9.5-alpha/")' /tmp/update.json >/dev/null
          jq -e '.sha256 | test("^[0-9a-fA-F]{64}$")' /tmp/update.json >/dev/null

          APK_URL=$(jq -r '.apkUrl' /tmp/update.json)
          curl --fail --silent --show-error --location --head "$APK_URL" >/dev/null

          mkdir -p dlavie-client
          cp /tmp/update.json dlavie-client/update.json

      - name: Publish manifest and remove one-shot promoter
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/update.json ]; then
            exit 0
          fi
          rm -f .github/workflows/promote-dlavie-client-0.9.5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dlavie-client/update.json .github/workflows/promote-dlavie-client-0.9.5.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "release: promote DLavie Client 0.9.5-alpha"
          git push origin main
