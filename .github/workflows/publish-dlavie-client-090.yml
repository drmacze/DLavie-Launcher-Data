name: Publish DLavie Client 0.9.0-alpha

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-dlavie-client-090.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify signed artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntprcentralindia.oaiusercontent.com/files/00000000-1b74-8208-9b0c-9592dd5a6144/raw?se=2026-08-06T13%3A58%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=b448468c-a5c2-53e9-bcb4-3a521f5e063b&skoid=5e5afa93-cb2e-42ad-a58a-830b5b446f03&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T05%3A45%3A32Z&ske=2026-08-07T05%3A45%3A32Z&sks=b&skv=2026-02-06&sig=MlhLnFs9bpoCsChFJqr51PR2jFYYusuElQ%2BBZszfnZA%3D' \
            --output artifact.zip
          unzip -o artifact.zip -d artifact
          test "$(sha256sum artifact/app-release.apk | awk '{print $1}')" = "7e9206c4feb11428ffd41e561ef2ec355ae900df131e4c75f80cbd1f3c07c875"
          mv artifact/app-release.apk DLavie-Client-0.9.0-alpha.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.9.0-alpha >/dev/null 2>&1; then
            gh release upload v0.9.0-alpha DLavie-Client-0.9.0-alpha.apk --clobber
          else
            gh release create v0.9.0-alpha DLavie-Client-0.9.0-alpha.apk \
              --title "DLavie Client 0.9.0-alpha" \
              --notes "Native GameBridge POC stage 1: exact APK/split/ABI/native-library fingerprint diagnostics, SHA-256 mapping for every packaged .so, primary-library selection, and strict adapter gating. No native hook is enabled until an exact build is validated on a physical device."
          fi

      - name: Update updater manifest
        run: |
          mkdir -p dlavie-client
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          published = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          sha = '7e9206c4feb11428ffd41e561ef2ec355ae900df131e4c75f80cbd1f3c07c875'
          manifest = {
            'latestVersionCode': 15,
            'latestVersionName': '0.9.0-alpha',
            'minimumSupportedVersionCode': 2,
            'mandatory': False,
            'apkUrl': 'https://github.com/drmacze/DLavie-Launcher-Data/releases/download/v0.9.0-alpha/DLavie-Client-0.9.0-alpha.apk',
            'sha256': sha,
            'notes': 'Native GameBridge POC tahap 1: pemetaan exact build GTA melalui APK/split, ABI, signer, serta SHA-256 setiap native library. Adapter native tetap terkunci sampai build perangkat nyata tervalidasi.',
            'publishedAt': published,
          }
          status = {
            'status': 'published',
            'version': '0.9.0-alpha',
            'versionCode': 15,
            'sha256': sha,
            'releaseUrl': 'https://github.com/drmacze/DLavie-Launcher-Data/releases/tag/v0.9.0-alpha',
            'publishedAt': published,
          }
          open('dlavie-client/update.json','w').write(json.dumps(manifest, indent=2)+'\n')
          open('dlavie-client/publish-status.json','w').write(json.dumps(status, indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dlavie-client/update.json dlavie-client/publish-status.json
          git commit -m "release: publish DLavie Client 0.9.0-alpha"
          git push
