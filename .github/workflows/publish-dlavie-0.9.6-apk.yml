name: Publish DLavie 0.9.6 APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-dlavie-0.9.6-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public launcher data
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate signed APK artifact
        shell: bash
        env:
          ARTIFACT_URL: 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-000c-81fa-bccb-b4bec4340d54/raw?se=2026-08-07T00%3A04%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=3f54eaed-99a5-5e4f-9104-d033a7e75aec&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T05%3A44%3A48Z&ske=2026-08-07T05%3A44%3A48Z&sks=b&skv=2026-02-06&sig=wcUuOBpjaymg%2Bq2da/R/I/dzjx2BAZ1g%2BRYqljJJX%2BI%3D'
          EXPECTED_ARTIFACT_SHA: cb6832a6709ec5bdbafb428749a3bef51b620370d508ca2b125bc8e63efd0474
          EXPECTED_APK_SHA: fba9362379fd930f84305fd4b1b74d54a4c5e93668616a8dc0662873880dedf2
        run: |
          set -euxo pipefail
          curl --fail --silent --show-error --location "$ARTIFACT_URL" --output /tmp/artifact.zip
          echo "$EXPECTED_ARTIFACT_SHA  /tmp/artifact.zip" | sha256sum --check --strict
          DEST="dlavie-client/releases/v0.9.6-alpha/DLavie-Client-0.9.6-alpha.apk"
          mkdir -p "$(dirname "$DEST")"
          unzip -p /tmp/artifact.zip 'app/build/outputs/apk/release/app-release.apk' > "$DEST"
          echo "$EXPECTED_APK_SHA  $DEST" | sha256sum --check --strict
          test "$(stat -c%s "$DEST")" = "6123468"

      - name: Publish final manifest and remove one-shot workflow
        shell: bash
        run: |
          set -euxo pipefail
          cat > dlavie-client/update.json <<'EOF'
          {
            "latestVersionCode": 21,
            "latestVersionName": "0.9.6-alpha",
            "minimumSupportedVersionCode": 2,
            "mandatory": false,
            "apkUrl": "https://raw.githubusercontent.com/drmacze/DLavie-Launcher-Data/main/dlavie-client/releases/v0.9.6-alpha/DLavie-Client-0.9.6-alpha.apk",
            "sha256": "fba9362379fd930f84305fd4b1b74d54a4c5e93668616a8dc0662873880dedf2",
            "notes": "Menambahkan native agent arm64 read-only untuk exact build Netflix 1.72.42919648. Agent memetakan pointer CJ, posisi, velocity, dan heading dengan verifikasi offset simbol. Agent belum dimuat ke proses GTA dan remote ped tetap nonaktif.",
            "publishedAt": "2026-08-06T23:55:12Z"
          }
          EOF
          rm -f .github/workflows/publish-dlavie-0.9.6-apk.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dlavie-client/update.json dlavie-client/releases/v0.9.6-alpha/DLavie-Client-0.9.6-alpha.apk .github/workflows/publish-dlavie-0.9.6-apk.yml
          git commit -m "release: publish DLavie Client 0.9.6-alpha APK"
          git push origin main
