name: Publish DLavie Client 0.9.8-alpha

on:
  push:
    paths:
      - .github/workflows/publish-dlavie-0.9.8.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-dlavie-client-0.9.8-alpha
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: v0.9.8-alpha
      ASSET_NAME: DLavie-Client-0.9.8-alpha.apk
      EXPECTED_APK_SHA256: fb8a4d8751f933a3355568ba75f632731e92f4b5c6abde3ccdf9170fe6a4b922
      EXPECTED_CERT_SHA256: 3f773167f7ab55ae1c6cfaa92b2bc85d46f2eade94611322b11b780fbfeb598b
      ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-4920-8211-a5ae-d83097c399b2/raw?se=2026-08-07T03%3A02%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=96adcb46-32fc-534b-8d36-6a637b0de6eb&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T02%3A53%3A17Z&ske=2026-08-08T02%3A53%3A17Z&sks=b&skv=2026-02-06&sig=Jr/4wBvsHiWTUa/9YPqfJzgd5FTHruk6SxVskThZNMg%3D'

    steps:
      - name: Checkout launcher data
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install APK verification tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'build-tools;35.0.0'

      - name: Download validated CI artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 "$ARTIFACT_URL" -o /tmp/dlavie-ci.zip
          mkdir -p /tmp/dlavie-ci
          unzip -q /tmp/dlavie-ci.zip -d /tmp/dlavie-ci
          APK=$(find /tmp/dlavie-ci -type f -path '*/app/build/outputs/apk/release/app-release.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "/tmp/$ASSET_NAME"
          echo "$EXPECTED_APK_SHA256  /tmp/$ASSET_NAME" | sha256sum -c -

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="/tmp/$ASSET_NAME"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.log
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.log
          grep -Fiq "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA256" /tmp/apksigner.log
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/badging.log
          grep -Fq "package: name='id.dlavie.client' versionCode='23' versionName='0.9.8-alpha'" /tmp/badging.log

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="/tmp/$ASSET_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title 'DLavie Client 0.9.8-alpha' \
              --notes 'Build riset exact-build loader. CI tervalidasi; update tidak mandatory. Pengujian perangkat fisik dan kompatibilitas Netflix masih diperlukan.'
          fi

      - name: Verify public release asset
        shell: bash
        run: |
          set -euo pipefail
          APK_URL="https://github.com/drmacze/DLavie-Launcher-Data/releases/download/$TAG/$ASSET_NAME"
          for attempt in 1 2 3 4 5; do
            if curl --fail --location "$APK_URL" -o /tmp/published.apk; then
              break
            fi
            sleep 3
          done
          test -s /tmp/published.apk
          echo "$EXPECTED_APK_SHA256  /tmp/published.apk" | sha256sum -c -

      - name: Publish launcher update manifest
        shell: bash
        run: |
          set -euo pipefail
          APK_URL="https://github.com/drmacze/DLavie-Launcher-Data/releases/download/$TAG/$ASSET_NAME"
          PUBLISHED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq \
            --argjson versionCode 23 \
            --arg versionName '0.9.8-alpha' \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$EXPECTED_APK_SHA256" \
            --arg notes 'Menambahkan exact-build loader lokal untuk target Netflix 1.72.42919648, bootstrap DEX, native runtime bridge read-only, signing AndroidKeyStore, validasi SHA-256/signer/build ID, dan dukungan alignment 16 KB. Build ini masih tahap riset dan belum lolos validasi perangkat fisik.' \
            --arg publishedAt "$PUBLISHED_AT" \
            '.latestVersionCode = $versionCode |
             .latestVersionName = $versionName |
             .mandatory = false |
             .apkUrl = $apkUrl |
             .sha256 = $sha256 |
             .notes = $notes |
             .publishedAt = $publishedAt' \
            dlavie-client/update.json > /tmp/update.json
          mv /tmp/update.json dlavie-client/update.json
          jq -e '.latestVersionCode == 23 and .latestVersionName == "0.9.8-alpha" and .mandatory == false' dlavie-client/update.json

      - name: Commit manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dlavie-client/update.json
          if git diff --cached --quiet; then
            echo 'Manifest already published.'
          else
            git commit -m 'release: publish DLavie Client 0.9.8-alpha'
            git push
          fi
