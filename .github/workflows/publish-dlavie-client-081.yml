name: Publish DLavie Client 0.8.1-alpha

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-dlavie-client-081.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify signed artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntprseasia.oaiusercontent.com/files/00000000-9264-8207-8cd1-b0538a32de9a/raw?se=2026-08-06T01:58:58Z&sp=r&sv=2026-02-06&sr=b&scid=a3a1b5b2-89ac-56f7-9c09-403d90cbc3a2&skoid=5e5afa93-cb2e-42ad-a58a-830b5b446f03&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T01:10:52Z&ske=2026-08-07T01:10:52Z&sks=b&skv=2026-02-06&sig=%2BBTt0Gtpj662fz2eR5y3nbV455ZsUdykcMWzG9tpgzk%3D' \
            --output artifact.zip
          unzip -o artifact.zip -d artifact
          test "$(sha256sum artifact/app-release.apk | awk '{print $1}')" = "2021219e055176f65107df03d59d461f90fa55f4d353de7895e5456b090dd586"
          mv artifact/app-release.apk DLavie-Client-0.8.1-alpha.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.8.1-alpha >/dev/null 2>&1; then
            gh release upload v0.8.1-alpha DLavie-Client-0.8.1-alpha.apk --clobber
          else
            gh release create v0.8.1-alpha DLavie-Client-0.8.1-alpha.apk \
              --title "DLavie Client 0.8.1-alpha" \
              --notes "LAN stabilization: integrated Host Lokal access, server PIN and capacity, QR/join-code sharing, live player administration with kick and ping, host metrics, automatic LAN reconnect, secured discovery metadata, and Android connected-device foreground service. Native GTA GameBridge remains unavailable."
          fi

      - name: Update public updater manifest
        run: |
          mkdir -p dlavie-client
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          published = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          manifest = {
              'latestVersionCode': 14,
              'latestVersionName': '0.8.1-alpha',
              'minimumSupportedVersionCode': 2,
              'mandatory': False,
              'apkUrl': 'https://github.com/drmacze/DLavie-Launcher-Data/releases/download/v0.8.1-alpha/DLavie-Client-0.8.1-alpha.apk',
              'sha256': '2021219e055176f65107df03d59d461f90fa55f4d353de7895e5456b090dd586',
              'notes': 'Stabilisasi LAN maksimal: PIN dan kapasitas server, QR/kode join, player list live + kick, ping/uptime/traffic metrics, reconnect otomatis, discovery yang lebih aman, serta Host Lokal terintegrasi ke aplikasi utama.',
              'publishedAt': published,
          }
          status = {
              'status': 'published',
              'version': '0.8.1-alpha',
              'versionCode': 14,
              'sha256': manifest['sha256'],
              'releaseUrl': 'https://github.com/drmacze/DLavie-Launcher-Data/releases/tag/v0.8.1-alpha',
              'publishedAt': published,
          }
          open('dlavie-client/update.json', 'w').write(json.dumps(manifest, indent=2) + '\n')
          open('dlavie-client/publish-status.json', 'w').write(json.dumps(status, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dlavie-client/update.json dlavie-client/publish-status.json
          git commit -m "release: publish DLavie Client 0.8.1-alpha"
          git push
