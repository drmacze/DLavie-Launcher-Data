name: Publish DLavie Client 0.4.0-alpha

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-dlavie-client-040.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified GitHub Actions artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-5a78-81fa-b476-f131feda6002/raw?se=2026-08-01T21:12:54Z&sp=r&sv=2026-02-06&sr=b&scid=ac651ad4-2ba7-5b32-bf39-9d30271cb3a9&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T01:25:32Z&ske=2026-08-02T01:25:32Z&sks=b&skv=2026-02-06&sig=IAnPBpWPU4jlUdlBvgsN28u0pcmntsjcnMbfgoXGEyM%3D' \
            --output artifact.zip
          unzip -o artifact.zip -d artifact
          test "$(sha256sum artifact/app-release.apk | awk '{print $1}')" = "aeb85797250b1177dc64a9db4145019cb5049a6123149e1022702e2ab67b3d32"
          mv artifact/app-release.apk DLavie-Client-0.4.0-alpha.apk

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.0-alpha >/dev/null 2>&1; then
            gh release upload v0.4.0-alpha DLavie-Client-0.4.0-alpha.apk --clobber
          else
            gh release create v0.4.0-alpha DLavie-Client-0.4.0-alpha.apk \
              --title "DLavie Client 0.4.0-alpha" \
              --notes "Account milestone: login/registration UI, encrypted Android Keystore session storage, access-token refresh bootstrap, and authenticated WebSocket handshake."
          fi

      - name: Update public manifest and status
        run: |
          mkdir -p dlavie-client
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          published = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          manifest = {
              'latestVersionCode': 7,
              'latestVersionName': '0.4.0-alpha',
              'minimumSupportedVersionCode': 2,
              'mandatory': False,
              'apkUrl': 'https://github.com/drmacze/DLavie-Launcher-Data/releases/download/v0.4.0-alpha/DLavie-Client-0.4.0-alpha.apk',
              'sha256': 'aeb85797250b1177dc64a9db4145019cb5049a6123149e1022702e2ab67b3d32',
              'notes': 'Sistem akun roleplay: layar login dan registrasi, token terenkripsi Android Keystore, refresh sesi otomatis saat startup, serta handshake WebSocket dengan access token.',
              'publishedAt': published,
          }
          status = {
              'status': 'published',
              'version': '0.4.0-alpha',
              'versionCode': 7,
              'sha256': manifest['sha256'],
              'releaseUrl': 'https://github.com/drmacze/DLavie-Launcher-Data/releases/tag/v0.4.0-alpha',
              'publishedAt': published,
          }
          open('dlavie-client/update.json', 'w').write(json.dumps(manifest, indent=2) + '\n')
          open('dlavie-client/publish-status.json', 'w').write(json.dumps(status, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dlavie-client/update.json dlavie-client/publish-status.json
          git commit -m "release: publish DLavie Client 0.4.0-alpha"
          git push
