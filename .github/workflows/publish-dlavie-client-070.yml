name: Publish DLavie Client 0.7.0-alpha

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-dlavie-client-070.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download verified GitHub Actions artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntprwestus3.oaiusercontent.com/files/00000000-b894-81fd-9598-632818b09169/raw?se=2026-08-05T12:17:14Z&sp=r&sv=2026-02-06&sr=b&scid=73f9d612-be63-5ff5-a195-6c351f48a53f&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T21:57:34Z&ske=2026-08-05T21:57:34Z&sks=b&skv=2026-02-06&sig=zTy8ccIVXyj0UDLyaAhc7OcdaClqBSGB4les3CdiFQc%3D' \
            --output artifact.zip
          unzip -o artifact.zip -d artifact
          test "$(sha256sum artifact/app-release.apk | awk '{print $1}')" = "eedb928ab890435277106ceaaffc1dd8335a56d6dd0eb09f9e154722d21677ab"
          mv artifact/app-release.apk DLavie-Client-0.7.0-alpha.apk

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.7.0-alpha >/dev/null 2>&1; then
            gh release upload v0.7.0-alpha DLavie-Client-0.7.0-alpha.apk --clobber
          else
            gh release create v0.7.0-alpha DLavie-Client-0.7.0-alpha.apk \
              --title "DLavie Client 0.7.0-alpha" \
              --notes "GameBridge compatibility milestone: exact GTA build fingerprint diagnostics, capability-aware multiplayer handshake, remote entity interpolation with stale-sequence rejection and capped extrapolation, and visible adapter status. Native GTA adapter remains unavailable until an exact build is validated."
          fi

      - name: Update public updater manifest
        run: |
          mkdir -p dlavie-client
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          published = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          manifest = {
              'latestVersionCode': 11,
              'latestVersionName': '0.7.0-alpha',
              'minimumSupportedVersionCode': 2,
              'mandatory': False,
              'apkUrl': 'https://github.com/drmacze/DLavie-Launcher-Data/releases/download/v0.7.0-alpha/DLavie-Client-0.7.0-alpha.apk',
              'sha256': 'eedb928ab890435277106ceaaffc1dd8335a56d6dd0eb09f9e154722d21677ab',
              'notes': 'GameBridge diagnostics: fingerprint build GTA, capability handshake, status adapter yang terlihat di launcher, serta interpolasi entity remote. Native adapter GTA belum diaktifkan sampai build exact tervalidasi.',
              'publishedAt': published,
          }
          status = {
              'status': 'published',
              'version': '0.7.0-alpha',
              'versionCode': 11,
              'sha256': manifest['sha256'],
              'releaseUrl': 'https://github.com/drmacze/DLavie-Launcher-Data/releases/tag/v0.7.0-alpha',
              'publishedAt': published,
          }
          open('dlavie-client/update.json', 'w').write(json.dumps(manifest, indent=2) + '\n')
          open('dlavie-client/publish-status.json', 'w').write(json.dumps(status, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dlavie-client/update.json dlavie-client/publish-status.json
          git commit -m "release: publish DLavie Client 0.7.0-alpha"
          git push
