name: Publish DLavie Client 0.3.2-alpha

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-dlavie-client-032.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified GitHub Actions artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-d174-81fa-86e3-d4a83caf6e39/raw?se=2026-08-01T21:01:04Z&sp=r&sv=2026-02-06&sr=b&scid=c616dbef-5874-5505-ba46-ca3fd3d2c1c9&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T01:24:15Z&ske=2026-08-02T01:24:15Z&sks=b&skv=2026-02-06&sig=6UGVfYVgZMKyR9hfZjBjw4IN23vcZJVOGpPWG%2BT7t10%3D' \
            --output artifact.zip
          unzip -o artifact.zip -d artifact
          test "$(sha256sum artifact/app-release.apk | awk '{print $1}')" = "51ef01190676eb37155540554f0ba7654a997a6d30e6fa72580ba772f60c17f7"
          mv artifact/app-release.apk DLavie-Client-0.3.2-alpha.apk

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.2-alpha >/dev/null 2>&1; then
            gh release upload v0.3.2-alpha DLavie-Client-0.3.2-alpha.apk --clobber
          else
            gh release create v0.3.2-alpha DLavie-Client-0.3.2-alpha.apk \
              --title "DLavie Client 0.3.2-alpha" \
              --notes "Crash-hardening release: cancellation-safe updater and APK validation, local crash diagnostics, authenticated backend foundation, and CI reliability improvements."
          fi

      - name: Update public manifest and publication status
        run: |
          mkdir -p dlavie-client
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          published = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          manifest = {
              'latestVersionCode': 6,
              'latestVersionName': '0.3.2-alpha',
              'minimumSupportedVersionCode': 2,
              'mandatory': False,
              'apkUrl': 'https://github.com/drmacze/DLavie-Launcher-Data/releases/download/v0.3.2-alpha/DLavie-Client-0.3.2-alpha.apk',
              'sha256': '51ef01190676eb37155540554f0ba7654a997a6d30e6fa72580ba772f60c17f7',
              'notes': 'Perbaikan aplikasi berhenti: operasi updater dan validasi APK kini aman terhadap lifecycle/cancellation, request aktif dibatalkan saat layar ditutup, crash report lokal ditambahkan, dan stabilitas build ditingkatkan.',
              'publishedAt': published,
          }
          status = {
              'status': 'published',
              'version': '0.3.2-alpha',
              'versionCode': 6,
              'sha256': manifest['sha256'],
              'releaseUrl': 'https://github.com/drmacze/DLavie-Launcher-Data/releases/tag/v0.3.2-alpha',
              'publishedAt': published,
          }
          open('dlavie-client/update.json', 'w').write(json.dumps(manifest, indent=2) + '\n')
          open('dlavie-client/publish-status.json', 'w').write(json.dumps(status, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dlavie-client/update.json dlavie-client/publish-status.json
          git commit -m "release: publish DLavie Client 0.3.2-alpha"
          git push
