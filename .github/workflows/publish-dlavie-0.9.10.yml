name: Publish DLavie Client 0.9.10-alpha

on:
  push:
    paths:
      - .github/workflows/publish-dlavie-0.9.10.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-dlavie-client-0.9.10-alpha
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: v0.9.10-alpha
      ASSET_NAME: DLavie-Client-0.9.10-alpha.apk
      EXPECTED_APK_SHA256: 5e500f80e92517b090da5b7f73201624a5555fa3a1cafec3fa119e7186b9aedf
      EXPECTED_CERT_SHA256: 3f773167f7ab55ae1c6cfaa92b2bc85d46f2eade94611322b11b780fbfeb598b
      ARTIFACT_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-a6f4-820b-9280-0251e4f9bb44/raw?se=2026-08-07T03%3A55%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=c2195e2c-6ae9-5094-bebb-f985de8f9f7c&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T01%3A08%3A48Z&ske=2026-08-08T01%3A08%3A48Z&sks=b&skv=2026-02-06&sig=DDNcIqI7mpQm5TCDV9vLq9TCBh5gdM7xKgVA%2BC3EcBc%3D'

    steps:
      - name: Checkout launcher data
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install APK verification tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'build-tools;35.0.0'

      - name: Download validated CI artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 "$ARTIFACT_URL" -o /tmp/dlavie-ci.zip
          mkdir -p /tmp/dlavie-ci
          unzip -q /tmp/dlavie-ci.zip -d /tmp/dlavie-ci
          APK=$(find /tmp/dlavie-ci -type f -path '*/app/build/outputs/apk/release/app-release.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "/tmp/$ASSET_NAME"
          echo "$EXPECTED_APK_SHA256  /tmp/$ASSET_NAME" | sha256sum -c -

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="/tmp/$ASSET_NAME"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.log
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.log
          grep -Fiq "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA256" /tmp/apksigner.log
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/badging.log
          grep -Fq "package: name='id.dlavie.client' versionCode='25' versionName='0.9.10-alpha'" /tmp/badging.log
          unzip -l "$APK" | tee /tmp/apk-contents.log
          grep -q 'META-INF/services/com.android.apksig.kms.KmsSignerEngineProvider' /tmp/apk-contents.log

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="/tmp/$ASSET_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title 'DLavie Client 0.9.10-alpha' \
              --notes 'Hotfix AndroidKeyStore provider routing. Update non-mandatory; pengujian perangkat fisik masih diperlukan.'
          fi

      - name: Verify public release asset
        shell: bash
        run: |
          set -euo pipefail
          APK_URL="https://github.com/drmacze/DLavie-Launcher-Data/releases/download/$TAG/$ASSET_NAME"
          for attempt in 1 2 3 4 5; do
            if curl --fail --location "$APK_URL" -o /tmp/published.apk; then
              break
            fi
            sleep 3
          done
          test -s /tmp/published.apk
          echo "$EXPECTED_APK_SHA256  /tmp/published.apk" | sha256sum -c -

      - name: Publish launcher update manifest
        shell: bash
        run: |
          set -euo pipefail
          APK_URL="https://github.com/drmacze/DLavie-Launcher-Data/releases/download/$TAG/$ASSET_NAME"
          PUBLISHED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq \
            --argjson versionCode 25 \
            --arg versionName '0.9.10-alpha' \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$EXPECTED_APK_SHA256" \
            --arg notes 'Memperbaiki kegagalan Failed to sign using signer DLAVIE pada beberapa ROM dengan adaptor AndroidKeyStore khusus. Loader tetap menggunakan signature v1/JAR, v2, dan v3 serta sekarang menyediakan laporan cause lengkap saat gagal.' \
            --arg publishedAt "$PUBLISHED_AT" \
            '.latestVersionCode = $versionCode |
             .latestVersionName = $versionName |
             .mandatory = false |
             .apkUrl = $apkUrl |
             .sha256 = $sha256 |
             .notes = $notes |
             .publishedAt = $publishedAt' \
            dlavie-client/update.json > /tmp/update.json
          mv /tmp/update.json dlavie-client/update.json
          jq -e '.latestVersionCode == 25 and .latestVersionName == "0.9.10-alpha" and .mandatory == false' dlavie-client/update.json

      - name: Commit manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dlavie-client/update.json
          if git diff --cached --quiet; then
            echo 'Manifest already published.'
          else
            git commit -m 'release: publish DLavie Client 0.9.10-alpha'
            git push
          fi
