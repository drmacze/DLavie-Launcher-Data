name: Publish DLavie Client 0.3.0-alpha

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-dlavie-client-030.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public release repository
        uses: actions/checkout@v4

      - name: Download and verify signed artifact
        env:
          ARTIFACT_URL: "https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-be90-81fa-88b3-a964d93151b7/raw?se=2026-08-01T14:19:28Z&sp=r&sv=2026-02-06&sr=b&scid=19a532c5-a649-5107-9960-65289b54054f&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T02:58:30Z&ske=2026-08-02T02:58:30Z&sks=b&skv=2026-02-06&sig=MdJ2zZiDb4kCKJNg97%2BHayD2Hhcnpq8ST7i/qbXSZcY%3D"
        run: |
          curl --fail --location "$ARTIFACT_URL" --output artifact.zip
          unzip -o artifact.zip
          mv app-release.apk DLavie-Client-0.3.0-alpha.apk
          echo "d4de5a1607378e6fbd7155080333dd6b0991b006cfa3ce176895aa91c1834b6f  DLavie-Client-0.3.0-alpha.apk" | sha256sum --check -

      - name: Create public release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.3.0-alpha
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" DLavie-Client-0.3.0-alpha.apk DLavie-Client-release.sha256 --clobber
          else
            gh release create "$TAG" \
              DLavie-Client-0.3.0-alpha.apk \
              DLavie-Client-release.sha256 \
              --title "DLavie Client 0.3.0-alpha" \
              --notes "Modern four-tab navigation, simplified game library, friendly server validation and connection errors, cleaner activity timeline, and updater UI separation."
          fi

      - name: Publish updater manifest and success marker
        run: |
          mkdir -p dlavie-client
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > dlavie-client/update.json <<EOF
          {
            "latestVersionCode": 4,
            "latestVersionName": "0.3.0-alpha",
            "minimumSupportedVersionCode": 2,
            "mandatory": false,
            "apkUrl": "https://github.com/drmacze/DLavie-Launcher-Data/releases/download/v0.3.0-alpha/DLavie-Client-0.3.0-alpha.apk",
            "sha256": "d4de5a1607378e6fbd7155080333dd6b0991b006cfa3ce176895aa91c1834b6f",
            "notes": "Tampilan baru dengan navigasi Beranda, Library, Server, dan Aktivitas. Alamat contoh dihapus, validasi server diperketat, serta error jaringan kini ditampilkan dengan bahasa yang mudah dipahami.",
            "publishedAt": "$PUBLISHED_AT"
          }
          EOF
          cat > dlavie-client/publish-status.json <<EOF
          {
            "status": "published",
            "version": "0.3.0-alpha",
            "versionCode": 4,
            "sha256": "d4de5a1607378e6fbd7155080333dd6b0991b006cfa3ce176895aa91c1834b6f",
            "releaseUrl": "https://github.com/drmacze/DLavie-Launcher-Data/releases/tag/v0.3.0-alpha",
            "publishedAt": "$PUBLISHED_AT"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dlavie-client/update.json dlavie-client/publish-status.json
          git commit -m "release: publish DLavie Client 0.3.0-alpha manifest" || exit 0
          git push
